name: medfinder
description: MedFinder - البحث عن الأدوية في أقرب الصيدليات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  signalr_netcore: ^1.3.7
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  mobile_scanner: ^5.1.1
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
